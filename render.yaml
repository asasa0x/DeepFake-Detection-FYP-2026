services:
  - type: web
    name: deepfake-detection-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: HOST
        value: "0.0.0.0"
